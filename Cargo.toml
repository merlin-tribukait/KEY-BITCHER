[package]
name = "key-bitcher"
version = "0.2.2"
edition = "2021"
description = "Key-Bitcher: AI env + secrets manager that syncs API keys from S3/Backblaze to .env and the Wave secret store, validates keys, benchmarks providers, and self-heals expired keys."
readme = "README.md"
license = "MIT"
repository = "https://github.com/merlin-tribukait/KEY-BITCHER"
keywords = [
  "secrets",
  "env",
  "s3",
  "backblaze",
  "wave",
  "api-keys",
  "key-bitcher",
]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
aws-config = { version = "1", default-features = false, features = [
  "rt-tokio",
  "credentials-process",
  "sso",
  "behavior-version-latest",
] }
aws-sdk-s3 = { version = "1", default-features = false, features = [
  "rt-tokio",
  "http-1x",
  "sigv4a",
] }
aws-smithy-http-client = { version = "1.2", features = [
  "default-client",
  "rustls-ring",
] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1.1"
which = "8"
